<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">

<title>游戏厅</title>

<link rel="stylesheet" href="assets/css/base.css?v=30">
<link rel="stylesheet" href="assets/css/live.css?v=30">
<link rel="stylesheet" href="assets/css/auth.css?v=34">
<link rel="stylesheet" href="assets/css/finance.css?v=31">
<link rel="stylesheet" href="assets/css/rewards.css?v=36">
<link rel="stylesheet" href="assets/css/bet.css?v=31">
<link rel="stylesheet" href="assets/css/hall.css?v=31">
<link rel="stylesheet" href="assets/css/games/poker.css?v=31">
<link rel="stylesheet" href="assets/css/game-page.css?v=33">
<link rel="stylesheet" href="assets/css/room.css?v=38">
<link rel="stylesheet" href="assets/css/table.css?v=30">
<link rel="stylesheet" href="assets/css/games/uno.css?v=31">
<link rel="stylesheet" href="assets/css/dialog.css?v=30">
<link rel="stylesheet" href="assets/css/estate.css?v=9">

<link rel="stylesheet" href="assets/css/desktop-game.css?v=34">
<link rel="stylesheet" href="assets/css/rating.css?v=35">

<link rel="stylesheet" href="assets/css/games/uno-table.css?v=31">
<link rel="stylesheet" href="assets/css/games/casual.css?v=2">
<link rel="stylesheet" href="assets/css/games/guandan.css?v=38">
<link rel="stylesheet" href="assets/css/games/mahjong.css?v=47">
<link rel="stylesheet" href="assets/css/games/ludo.css?v=2">
<link rel="stylesheet" href="assets/css/games/liarsbar.css?v=2">
<link rel="stylesheet" href="assets/css/games/werewolf.css?v=2">
</head>


<body>


<!-- ======================================================
     顶部
====================================================== -->

<header class="header game-header" id="gameHeader">

<div class="left-header" id="leftHeader">

    <div class="logo">
        游戏厅
    </div>

    <a
        class="online-stat hall-stat hall-back"
        href="index.html"
        title="返回直播间"
    >
        <span class="hall-stat-icon">←</span>
        <span class="online-stat-name bet-stat-title">直播间</span>
    </a>

    <div
        class="online-stat"
        id="onlineStat"
        title="在线人数"
    >
        <span class="online-stat-number" id="onlineNumber">0</span>
        <span class="online-stat-name">在线</span>
    </div>

    <button class="online-stat game-audio-open" id="hallAudioSettingsButton" type="button" aria-label="音效设置" title="音效设置">
        <span aria-hidden="true">🔊</span><span class="online-stat-name">音效</span>
    </button>

</div>


<div class="user-area" id="userArea">

    <button
        class="login-button"
        id="loginButton"
    >
        登录
    </button>

    <button
        class="online-stat coin-chip"
        id="coinChip"
        type="button"
        title="财务管理"
    >
        <span class="online-stat-number" id="coinBalance">--</span>
        <span class="online-stat-name">金币</span>
    </button>

    <button
        class="user-chip"
        id="userChip"
        type="button"
        aria-haspopup="menu"
        aria-expanded="false"
    >
        <div
            class="user-avatar"
            id="userAvatar"
        >
            U
        </div>

        <div
            class="user-name"
            id="userName"
        >
        </div>
    </button>

    <div
        class="user-dropdown"
        id="userDropdown"
        hidden
    >
        <div class="user-dropdown-name" id="dropdownName"></div>
        <button class="user-dropdown-item" id="rewardsButton" type="button">每日奖励 / 抽奖</button>
        <button
            class="user-dropdown-item"
            id="financeButton"
            type="button"
        >
            财务管理
        </button>

        <div class="user-dropdown-divider"></div>

        <button
            class="user-dropdown-item danger-item"
            id="logoutButton"
            type="button"
        >
            退出登录
        </button>

        <div class="user-dropdown-version">游戏厅 v1</div>
    </div>

</div>


<div
    class="room-topbar"
    id="roomTopbar"
    hidden
>
    <button
        class="room-leave"
        id="leaveRoomButton"
        type="button"
    >
        ← 离开房间
    </button>

    <div
        class="room-topbar-name"
        id="roomTopName"
    ></div>

    <span
        class="spectate-badge"
        id="spectateBadge"
        hidden
    ></span>

    <button class="room-audio-open" id="roomAudioSettingsButton" type="button" aria-label="音效设置" title="音效设置">🔊</button>

    <div
        class="room-manage"
        id="roomManage"
        hidden
    >
        <button
            class="room-manage-toggle"
            id="manageButton"
            type="button"
        >
            管理 ▾
        </button>

        <div
            class="room-manage-menu"
            id="manageMenu"
            hidden
        >
            <button
                class="room-manage-item danger-fill"
                id="manageDrawButton"
                type="button"
            >
                流局
            </button>

            <button
                class="room-manage-item"
                id="managePauseButton"
                type="button"
            >
                暂停
            </button>

            <button
                class="room-manage-item"
                id="manageRestartButton"
                type="button"
            >
                重新开始
            </button>
        </div>
    </div>

    <div
        class="room-manage spectate-manage"
        id="spectateManage"
        hidden
    >
        <button
            class="room-manage-toggle"
            id="spectateButton"
            type="button"
            aria-haspopup="menu"
        >
            更换玩家 ▾
        </button>

        <div
            class="room-manage-menu"
            id="spectateMenu"
            role="menu"
            hidden
        ></div>
    </div>

</div>

</header>



<!-- ======================================================
     主页面
====================================================== -->

<div class="game-workspace">
<main
    class="game-container"
    id="gameMain"
>
    <div class="game-loading">
        正在连接游戏厅…
    </div>
</main>
</div>



<!-- ======================================================
     登录注册窗口
====================================================== -->

<div
    class="modal"
    id="loginModal"
>

<div class="login-card">


<h2 id="authTitle">
    登录游戏厅
</h2>


<input
    class="login-input"
    id="username"
    maxlength="20"
    autocomplete="username"
    placeholder="用户名"
>


<input
    class="login-input"
    id="password"
    type="password"
    maxlength="128"
    autocomplete="current-password"
    placeholder="密码"
>

<input
    class="login-input"
    hidden
    id="inviteCode"
    maxlength="32"
    autocomplete="off"
    placeholder="邀请码"
>


<button
    class="login-submit"
    id="authSubmit"
    type="button"
>
    登录
</button>


<div
    class="auth-switch"
    id="authSwitch"
>

    还没有账号？

    <span class="auth-link">
        注册
    </span>

</div>


</div>

</div>



<!-- ======================================================
     财务管理窗口
====================================================== -->

<div
    class="modal"
    id="financeModal"
>

<div class="login-card">

<h2>
    财务管理
</h2>


<div class="finance-balance">

    <span class="finance-balance-label">我的金币</span>

    <span class="finance-balance-value" id="financeBalance">--</span>

</div>


<div class="finance-tabs">

    <button
        class="finance-tab active"
        id="financeTabDetail"
        type="button"
    >
        金币明细
    </button>

    <button
        class="finance-tab"
        id="financeTabTransfer"
        type="button"
    >
        转账
    </button>

</div>


<div class="finance-panel" id="financeDetailPanel">

    <div
        class="finance-list"
        id="financeList"
    ></div>

</div>


<div
    class="finance-panel"
    id="financeTransferPanel"
    hidden
>

    <input
        id="transferTo"
        type="hidden"
    >

    <div
        class="user-select"
        id="transferSelect"
    >
        <button
            class="user-select-toggle"
            id="transferSelectToggle"
            type="button"
        >
            <span class="user-select-placeholder">选择转账对象…</span>
        </button>

        <div
            class="user-select-menu"
            id="transferSelectMenu"
            hidden
        >
            <div
                class="user-select-list"
                id="transferSelectList"
            ></div>
        </div>
    </div>

    <input
        class="login-input"
        id="transferAmount"
        type="number"
        min="0.01"
        step="0.01"
        placeholder="转账金币数量"
    >

    <button
        class="login-submit"
        id="transferSubmit"
        type="button"
    >
        确认转账
    </button>

    <div
        class="transfer-feedback"
        id="transferFeedback"
    ></div>

</div>


<div
    class="auth-switch"
    id="financeClose"
>

    <span class="auth-link">
        关闭
    </span>

</div>


</div>

</div>


<div class="game-audio-modal" id="gameAudioSettingsModal" hidden>
    <section class="game-audio-dialog" role="dialog" aria-modal="true" aria-labelledby="gameAudioTitle">
        <header class="game-audio-dialog-head">
            <h2 id="gameAudioTitle">游戏音效</h2>
            <button id="gameAudioCloseButton" type="button" aria-label="关闭音效设置">×</button>
        </header>
        <label class="game-audio-enabled-row">
            <input id="gameAudioEnabled" type="checkbox">
            <span>音效</span>
        </label>
        <label class="game-audio-volume-row" for="gameAudioVolume">
            <span>音量</span><output id="gameAudioVolumeValue" for="gameAudioVolume">60%</output>
            <input id="gameAudioVolume" type="range" min="0" max="100" step="1" aria-label="音效音量">
        </label>
        <button class="game-audio-preview" id="gameAudioPreviewButton" type="button">试听音效</button>
    </section>
</div>

<script src="assets/vendor/livekit-client.umd.min.js?v=1" defer></script>
<script src="assets/transfer-select.js?v=31" defer></script>
<script src="assets/rewards.js?v=37" defer></script>
<script type="module" src="assets/js/main.js?v=63"></script>


</body>

</html>
