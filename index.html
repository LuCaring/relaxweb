<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>我的直播间</title>

<link rel="stylesheet" href="assets/css/base.css?v=27">
<link rel="stylesheet" href="assets/css/live.css?v=27">
<link rel="stylesheet" href="assets/css/auth.css?v=34">
<link rel="stylesheet" href="assets/css/finance.css?v=28">
<link rel="stylesheet" href="assets/css/rewards.css?v=36">
<link rel="stylesheet" href="assets/css/bet.css?v=28">
<link rel="stylesheet" href="assets/css/hall.css?v=28">
<link rel="stylesheet" href="assets/css/games/poker.css?v=31">
<link rel="stylesheet" href="assets/css/game-page.css?v=32">
<link rel="stylesheet" href="assets/css/room.css?v=33">
<link rel="stylesheet" href="assets/css/table.css?v=27">
<link rel="stylesheet" href="assets/css/games/uno.css?v=31">
<link rel="stylesheet" href="assets/css/dialog.css?v=27">

</head>


<body class="live-page">


<!-- ======================================================
     顶部
====================================================== -->

<header class="header">

<div class="left-header" id="leftHeader">

    <div class="logo">
        Live
    </div>

    <button
        class="header-menu-toggle"
        id="headerMenuButton"
        type="button"
        aria-haspopup="menu"
        aria-expanded="false"
        aria-label="功能菜单"
    >
        ▾
    </button>

    <div
        class="header-menu"
        id="headerMenu"
    >
        <button
            class="header-menu-item"
            id="menuOnlineButton"
            type="button"
        >
            <span class="header-menu-icon">👥</span>
            在线用户 <span class="header-menu-count" id="menuOnlineCount">0</span>
        </button>

        <button
            class="header-menu-item"
            id="menuBetButton"
            type="button"
        >
            <span class="header-menu-icon">🎲</span>
            <span id="menuBetText">竞猜</span>
        </button>

        <a
            class="header-menu-item"
            href="game.html"
        >
            <span class="header-menu-icon">🎮</span>
            游戏厅
        </a>
    </div>

    <div class="online-stat" id="onlineStat">
        <span class="online-stat-number" id="onlineNumber">0</span>
        <span class="online-stat-name">在线观众</span>
    </div>

    <div
        class="online-stat bet-stat"
        id="betStat"
        title="竞猜"
    >
        <span class="bet-stat-icon">🎲</span>
        <span class="online-stat-name bet-stat-title" id="betStatTitle">竞猜</span>
    </div>

    <a
        class="online-stat hall-stat"
        id="gameHallButton"
        href="game.html"
        title="游戏厅"
    >
        <span class="hall-stat-icon">🎮</span>
        <span class="online-stat-name bet-stat-title" id="gameHallTitle">游戏厅</span>
    </a>

    <div
        class="online-popover"
        id="onlinePopover"
        hidden
    >
        <div class="online-popover-title">
            在线用户 · <span id="onlinePopoverCount">0</span>
        </div>

        <div
            class="online-popover-list"
            id="onlinePopoverList"
        ></div>
    </div>

</div>


<div class="user-area" id="userArea">

    <button
        class="login-button"
        id="loginButton"
    >
        登录
    </button>

    <button
        class="user-chip"
        id="userChip"
        type="button"
        aria-haspopup="menu"
        aria-expanded="false"
    >
        <div
            class="user-avatar"
            id="userAvatar"
        >
            U
        </div>

        <div
            class="user-name"
            id="userName"
        >
        </div>
    </button>

    <div
        class="user-dropdown"
        id="userDropdown"
        hidden
    >
        <div class="user-dropdown-name" id="dropdownName"></div>
        <button class="user-dropdown-item" id="rewardsButton" type="button">每日奖励 / 抽奖</button>
        <button
            class="user-dropdown-item"
            id="profileButton"
            type="button"
        >
            修改资料
        </button>

        <button
            class="user-dropdown-item"
            id="financeButton"
            type="button"
        >
            财务管理
        </button>

        <button
            class="user-dropdown-item"
            id="inviteButton"
            type="button"
        >
            邀请码
        </button>

        <button
            class="user-dropdown-item danger-item"
            id="deleteAccountButton"
            type="button"
        >
            注销账号
        </button>

        <div class="user-dropdown-divider"></div>

        <button
            class="user-dropdown-item danger-item"
            id="logoutButton"
            type="button"
        >
            退出登录
        </button>

        <div class="user-dropdown-version">前端 v9</div>
    </div>

</div>

</header>



<!-- ======================================================
     主页面
====================================================== -->

<div class="container">

<div class="live-layout">


<!-- ======================================================
     左侧
====================================================== -->

<div class="video-column">


<div class="video-card">


<!-- 播放器 -->

<div
    class="player"
    id="player"
>

<div class="player-stage">

<video
    id="streamVideo"
    autoplay
    playsinline
></video>

<div class="player-message" id="playerMessage">
    正在连接直播…
</div>


<!-- 弹幕层 -->

<div
    class="danmaku-layer"
    id="danmakuLayer"
></div>


<!-- LIVE -->

<div class="live-overlay">

    <div class="live-badge">
        LIVE
    </div>

</div>


<!-- 播放器工具 -->

<div class="player-tools" id="playerTools">

    <div class="player-tool-group player-tools-left">
        <button class="player-tool" id="playToggle" type="button" title="播放" aria-label="播放">
            ▶
        </button>
    </div>

    <div class="player-tool-group player-tools-right">
        <button class="player-tool" id="muteToggle" type="button" title="静音" aria-label="静音">
            🔊
        </button>

        <input
            class="volume-slider"
            id="volumeSlider"
            type="range"
            min="0"
            max="1"
            step="0.05"
            value="1"
            aria-label="音量"
        >

        <button
            class="player-tool active"
            id="danmakuToggle"
            type="button"
            title="关闭弹幕"
            aria-label="关闭弹幕"
        >
            💬
        </button>

        <button
            class="player-tool"
            id="fullscreenButton"
            type="button"
            title="进入全屏"
            aria-label="进入全屏"
        >
            ⤢
        </button>
    </div>

</div>

</div>

</div>





</div>



</div>


<!-- ======================================================
     聊天室
====================================================== -->

<div class="chat-card" id="chatCard">


<div class="chat-header">

    <div class="chat-title">
        直播聊天
    </div>

    <div
        class="chat-status"
        id="chatStatus"
    >
        ● 连接中
    </div>

</div>



<div
    class="messages"
    id="messages"
>

    <div class="message">

        <div class="message-avatar">
            ·
        </div>

        <div>

            <div class="message-user">
                系统
            </div>

            <div class="message-text">
                正在连接聊天室……
            </div>

        </div>

    </div>

</div>

<div class="danmaku-composer" id="danmakuComposer">
    <span class="danmaku-composer-label">弹幕</span>
    <input
        class="chat-input"
        id="chatInput"
        maxlength="200"
        placeholder="登录后发送弹幕..."
        aria-label="弹幕内容"
    >
    <button
        class="send-button"
        id="sendButton"
        type="button"
    >
        发送
    </button>
</div>


</div>


</div>

</div>



<!-- ======================================================
     登录注册窗口
====================================================== -->

<div
    class="modal"
    id="loginModal"
>

<div class="login-card">


<h2 id="authTitle">
    登录直播间
</h2>


<input
    class="login-input"
    id="username"
    maxlength="20"
    autocomplete="username"
    placeholder="用户名"
>


<input
    class="login-input"
    id="password"
    type="password"
    maxlength="128"
    autocomplete="current-password"
    placeholder="密码"
>

<input
    class="login-input"
    hidden
    id="inviteCode"
    maxlength="32"
    autocomplete="off"
    placeholder="邀请码"
>


<button
    class="login-submit"
    id="authSubmit"
    type="button"
>
    登录
</button>


<div
    class="auth-switch"
    id="authSwitch"
>

    还没有账号？

    <span class="auth-link">
        注册
    </span>

</div>


</div>

</div>



<!-- ======================================================
     修改资料窗口
====================================================== -->

<div
    class="modal"
    id="profileModal"
>

<div class="login-card">


<h2>
    修改资料
</h2>


<button
    class="avatar-button"
    id="avatarButton"
    type="button"
    title="更换头像"
>

    <img
        alt=""
        hidden
        id="avatarPreview"
    >

    <span id="avatarFallback"></span>

</button>


<div class="avatar-hint">

    点击头像更换图片（自动压缩）

    <button
        class="avatar-reset"
        id="avatarReset"
        type="button"
    >
        恢复默认
    </button>

</div>


<input
    class="login-input"
    id="nicknameInput"
    maxlength="20"
    placeholder="昵称（留空则显示用户名）"
>

<button
    class="login-submit"
    id="profileSubmit"
    type="button"
>
    保存
</button>

<input
    accept="image/*"
    hidden
    id="avatarFile"
    type="file"
>


</div>

</div>


<!-- ======================================================
     邀请码窗口
====================================================== -->

<div
    class="modal"
    id="inviteModal"
>

<div class="login-card">


<h2>
    邀请码
</h2>


<p class="delete-warning">

    每个邀请码可邀请一位朋友注册，只能使用一次。

</p>


<div
    class="invite-list"
    id="inviteList"
></div>


<button
    class="login-submit"
    id="inviteCreate"
    type="button"
>
    生成新邀请码
</button>


<div
    class="auth-switch"
    id="inviteClose"
>

    <span class="auth-link">
        关闭
    </span>

</div>


</div>

</div>


<!-- ======================================================
     注销账号窗口
====================================================== -->

<div
    class="modal"
    id="deleteModal"
>

<div class="login-card">


<h2>
    注销账号
</h2>


<p class="delete-warning">

    注销后账号与登录状态将被删除且无法恢复，请输入密码确认。

</p>


<input
    class="login-input"
    id="deletePassword"
    placeholder="密码"
    type="password"
>

<button
    class="login-submit danger"
    id="deleteSubmit"
    type="button"
>
    注销账号
</button>


<div
    class="auth-switch"
    id="deleteCancel"
>

    <span class="auth-link">取消</span>

</div>


</div>

</div>


<!-- ======================================================
     财务管理窗口
====================================================== -->

<div
    class="modal"
    id="financeModal"
>

<div class="login-card">

<h2>
    财务管理
</h2>


<div class="finance-balance">

    <span class="finance-balance-label">我的金币</span>

    <span class="finance-balance-value" id="financeBalance">--</span>

</div>


<div class="finance-tabs">

    <button
        class="finance-tab active"
        id="financeTabDetail"
        type="button"
    >
        金币明细
    </button>

    <button
        class="finance-tab"
        id="financeTabTransfer"
        type="button"
    >
        转账
    </button>

</div>


<div class="finance-panel" id="financeDetailPanel">

    <div
        class="finance-list"
        id="financeList"
    ></div>

</div>


<div
    class="finance-panel"
    id="financeTransferPanel"
    hidden
>

    <input
        id="transferTo"
        type="hidden"
    >

    <div
        class="user-select"
        id="transferSelect"
    >
        <button
            class="user-select-toggle"
            id="transferSelectToggle"
            type="button"
        >
            <span class="user-select-placeholder">选择转账对象…</span>
        </button>

        <div
            class="user-select-menu"
            id="transferSelectMenu"
            hidden
        >
            <div
                class="user-select-list"
                id="transferSelectList"
            ></div>
        </div>
    </div>

    <input
        class="login-input"
        id="transferAmount"
        type="number"
        min="0.01"
        step="0.01"
        placeholder="转账金币数量"
    >

    <button
        class="login-submit"
        id="transferSubmit"
        type="button"
    >
        确认转账
    </button>

    <div
        class="transfer-feedback"
        id="transferFeedback"
    ></div>

</div>


<div
    class="auth-switch"
    id="financeClose"
>

    <span class="auth-link">
        关闭
    </span>

</div>


</div>

</div>


<!-- ======================================================
     竞猜窗口
====================================================== -->

<div
    class="modal"
    id="betModal"
>

<div class="login-card bet-card">

<h2 id="betModalTitle">
    竞猜
</h2>

<div id="betModalBody"></div>

<div
    class="auth-switch"
    id="betClose"
>

    <span class="auth-link">
        关闭
    </span>

</div>


</div>

</div>


<script type="module" src="assets/js/dialog-global.js?v=27"></script>
<script src="assets/reader.js?v=27" defer></script>
<script src="assets/transfer-select.js?v=28" defer></script>
<script src="assets/rewards.js?v=37" defer></script>
<script src="assets/app.js?v=38" defer></script>


</body>

</html>
